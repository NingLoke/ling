<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日 · 计划</title>
<meta name="description" content="每日任务、行程和待办，手机和电脑都能看。">
<meta name="theme-color" content="#f3efe6">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="计划">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* ---------- 审美参数：颜色、字体、圆角都在这里，改这里就能换风格 ---------- */
:root {
  --paper: #f3efe6;
  --paper-hi: #fbf9f4;
  --ink: #1d1c1a;
  --ink-2: #4f4b45;
  --ink-3: #7a746a;
  --wash: rgba(29, 28, 26, .045);
  --line: rgba(29, 28, 26, .12);
  --line-2: rgba(29, 28, 26, .22);
  --accent: #b5412e;           /* 主色：印章红 */
  --accent-wash: rgba(181, 65, 46, .08);
  --class: #3f6b5c;            /* 课程：竹青 */
  --class-wash: rgba(63, 107, 92, .09);
  --on-ink: #f8f4ec;
  --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto, "Segoe UI", sans-serif;
  --radius: 16px;
  --gutter: 16px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.55 var(--sans);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-family: var(--serif); font-variant-numeric: tabular-nums lining-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 布局 ---------- */
.app {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 20px) var(--gutter) calc(env(safe-area-inset-bottom) + 110px);
  display: grid;
  gap: 22px;
}
@media (min-width: 960px) {
  .app {
    max-width: 1240px;
    padding: 40px 32px 60px;
    grid-template-columns: 300px minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "side line list";
    align-items: start;
    gap: 28px;
  }
  .side { grid-area: side; position: sticky; top: 40px; }
  .col-line { grid-area: line; }
  .col-list { grid-area: list; }
}

/* ---------- 头部：日期 + 进度 ---------- */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head .eyebrow { color: var(--ink-3); font-size: 13px; letter-spacing: .08em; }
.head h1 { font-family: var(--serif); font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: .02em; }
.head h1 small { font-size: 18px; color: var(--ink-2); font-weight: 500; margin-left: 6px; }
.ring { width: 64px; height: 64px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 5; }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--ink-2); }

/* ---------- 周条 ---------- */
.week { margin-top: 18px; }
.week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; color: var(--ink-3); font-size: 13px; }
.week-nav button { border: 0; background: none; padding: 6px 10px; border-radius: 10px; color: var(--ink-2); }
.week-nav button:hover { background: var(--wash); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day {
  border: 0; background: none; padding: 8px 0 10px; border-radius: 12px;
  display: grid; justify-items: center; gap: 2px; position: relative;
}
.day:hover { background: var(--wash); }
.day .dn { font-size: 11px; color: var(--ink-3); }
.day .dd { font-family: var(--serif); font-size: 18px; }
.day.today .dd { color: var(--accent); }
.day.sel { background: var(--ink); color: var(--on-ink); }
.day.sel .dn { color: rgba(248, 244, 236, .7); }
.day.sel.today .dd { color: var(--on-ink); }
.day .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
.day.has .dot { background: var(--accent); }
.day.sel.has .dot { background: var(--on-ink); }

.side-tools { display: none; }
@media (min-width: 960px) {
  .side-tools { display: grid; gap: 8px; margin-top: 24px; }
  .side-tools button { justify-self: start; }
}

/* ---------- 卡片 / 区块 ---------- */
.block { display: grid; gap: 10px; }
.block-title { display: flex; align-items: baseline; justify-content: space-between; }
.block-title h2 { font-family: var(--serif); font-size: 19px; font-weight: 700; letter-spacing: .04em; }
.block-title .meta { color: var(--ink-3); font-size: 13px; }
.card { background: var(--paper-hi); border: 1px solid var(--line); border-radius: var(--radius); }
.empty { color: var(--ink-3); font-size: 14px; padding: 18px; text-align: center; }

/* ---------- 行程时间线 ---------- */
.line { list-style: none; margin: 0; padding: 6px 0; }
.ev {
  display: grid; grid-template-columns: 58px 1fr; gap: 12px;
  padding: 10px 16px; position: relative; cursor: pointer;
}
.ev + .ev { border-top: 1px dashed var(--line); }
.ev:hover { background: var(--wash); }
.ev .t { font-size: 15px; line-height: 1.3; }
.ev .t small { display: block; color: var(--ink-3); font-size: 12px; }
.ev .body { border-left: 3px solid var(--accent); padding-left: 12px; min-width: 0; }
.ev.class .body { border-color: var(--class); }
.ev .title { font-weight: 600; }
.ev .sub { color: var(--ink-3); font-size: 13px; overflow-wrap: anywhere; }
.ev .tag { font-size: 11px; color: var(--class); background: var(--class-wash); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; font-weight: 500; }
.ev.past { opacity: .5; }
.ev.live { background: var(--accent-wash); }
.ev.class.live { background: var(--class-wash); }
.now {
  list-style: none; position: relative; height: 0; margin: 0 16px;
  border-top: 1.5px solid var(--accent);
}
.now::before { content: ""; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.now span { position: absolute; right: 0; top: -10px; font-size: 11px; color: var(--accent); background: var(--paper-hi); padding: 0 4px; }

/* ---------- 勾选清单（任务 + 待办） ---------- */
.checks { list-style: none; margin: 0; padding: 4px 0; }
.check { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.check + .check { border-top: 1px dashed var(--line); }
.check .box {
  width: 22px; height: 22px; flex: none; border-radius: 7px;
  border: 1.5px solid var(--line-2); background: none; padding: 0;
  display: grid; place-items: center; transition: background .15s, border-color .15s;
}
.check .box svg { width: 14px; height: 14px; opacity: 0; transition: opacity .15s; }
.check.done .box { background: var(--ink); border-color: var(--ink); }
.check.done .box svg { opacity: 1; }
.check .txt { flex: 1; min-width: 0; cursor: pointer; }
.check .txt b { font-weight: 500; }
.check.done .txt b { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-2); }
.check .txt small { display: block; color: var(--ink-3); font-size: 12px; }
.check .txt small.late { color: var(--accent); }
.check .star { color: var(--accent); font-size: 13px; }
.group-label { padding: 10px 16px 0; font-size: 12px; color: var(--ink-3); letter-spacing: .06em; }

/* ---------- 按钮 ---------- */
.btn {
  border: 1px solid var(--line-2); background: var(--paper-hi); border-radius: 12px;
  padding: 9px 14px; font-size: 14px;
}
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.danger { color: var(--accent); }
.fab {
  position: fixed; right: max(var(--gutter), calc(50% - 280px + var(--gutter))); bottom: calc(env(safe-area-inset-bottom) + 24px);
  width: 58px; height: 58px; border-radius: 20px; border: 0;
  background: var(--ink); color: var(--on-ink); font-size: 28px; line-height: 1;
  box-shadow: 0 10px 24px rgba(29, 28, 26, .22);
}
.head-right { display: flex; align-items: flex-start; gap: 4px; }
.icon-btn { border: 0; background: none; width: 36px; height: 36px; border-radius: 12px; color: var(--ink-2); display: grid; place-items: center; }
.icon-btn:hover { background: var(--wash); }
@media (min-width: 960px) {
  .fab, .gear { display: none; }
}

/* ---------- 弹出表单 ---------- */
dialog {
  border: 0; padding: 0; background: var(--paper-hi); color: var(--ink);
  width: min(520px, 100vw); max-height: 92vh; border-radius: 22px;
  box-shadow: 0 24px 60px rgba(29, 28, 26, .25);
}
dialog::backdrop { background: rgba(29, 28, 26, .35); }
@media (max-width: 600px) {
  dialog { margin: auto 0 0; max-width: 100vw; border-radius: 22px 22px 0 0; padding-bottom: env(safe-area-inset-bottom); }
}
.sheet { padding: 20px; display: grid; gap: 14px; }
.sheet h3 { font-family: var(--serif); font-size: 20px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--wash); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: none; padding: 8px; border-radius: 10px; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--paper-hi); color: var(--ink); box-shadow: 0 1px 3px rgba(29, 28, 26, .12); font-weight: 600; }
.field { display: grid; gap: 5px; font-size: 13px; color: var(--ink-3); }
.field input, .field select {
  border: 1px solid var(--line-2); border-radius: 12px; background: var(--paper);
  padding: 10px 12px; font-size: 16px; color: var(--ink); width: 100%;
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line-2); background: none; border-radius: 10px; padding: 6px 11px; font-size: 14px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
.actions .spacer { flex: 1; }
.hint { font-size: 12px; color: var(--ink-3); }
[hidden] { display: none !important; }

/* ---------- 同步 ---------- */
.sync-pill {
  border: 0; background: none; padding: 0 0 0 10px; margin: 0;
  font-size: 12px; letter-spacing: .02em; color: var(--ink-3);
}
.sync-pill::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--class); margin-right: 5px; vertical-align: 1px; }
.sync-pill[data-mode="syncing"]::before { background: var(--ink-3); animation: pulse 1s ease-in-out infinite; }
.sync-pill[data-mode="offline"]::before, .sync-pill[data-mode="signed-out"]::before { background: var(--line-2); }
.sync-pill[data-mode="error"] { color: var(--accent); }
.sync-pill[data-mode="error"]::before { background: var(--accent); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .sync-pill::before { animation: none !important; } }
.sync-box { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
.sync-box h4 { margin: 0; font-size: 15px; }
.sync-box form, .sync-box > div { display: grid; gap: 10px; }
.sync-box code { font-size: 12px; background: var(--wash); padding: 1px 4px; border-radius: 4px; }
.account { font-weight: 600; overflow-wrap: anywhere; }
.form-error { color: var(--accent); font-size: 13px; min-height: 0; }
.form-error:empty { display: none; }
.btn.link { border-color: transparent; background: none; color: var(--ink-3); }
.btn.google { justify-self: start; }
</style>
</head>
<body>
<main class="app" id="app">

  <section class="side">
    <header class="head">
      <div>
        <p class="eyebrow"><span id="eyebrow"></span><button class="sync-pill" id="sync-pill" data-open-settings hidden></button></p>
        <h1 id="title"></h1>
      </div>
      <div class="head-right">
      <button class="icon-btn gear" data-open-settings aria-label="设置">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
      <div class="ring" aria-label="完成进度">
        <svg viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="27"/><circle class="bar" id="ring-bar" cx="32" cy="32" r="27"/></svg>
        <span class="num" id="ring-text"></span>
      </div>
      </div>
    </header>
    <nav class="week" aria-label="选择日期">
      <div class="week-nav">
        <button data-week="-7" aria-label="上一周">‹ 上周</button>
        <button data-go-today>回到今天</button>
        <button data-week="7" aria-label="下一周">下周 ›</button>
      </div>
      <div class="days" id="days"></div>
    </nav>
    <div class="side-tools">
      <button class="btn primary" data-add>＋ 新建</button>
      <button class="btn" data-open-settings>设置 · 同步</button>
    </div>
  </section>

  <section class="block col-line">
    <div class="block-title"><h2>行程</h2><span class="meta" id="line-meta"></span></div>
    <div class="card"><ol class="line" id="line"></ol></div>
  </section>

  <div class="col-list" style="display:grid;gap:22px">
    <section class="block">
      <div class="block-title"><h2>每日任务</h2><span class="meta" id="habit-meta"></span></div>
      <div class="card"><ul class="checks" id="habits"></ul></div>
    </section>
    <section class="block">
      <div class="block-title"><h2>待办</h2><span class="meta" id="todo-meta"></span></div>
      <div class="card" id="todos"></div>
    </section>
  </div>
</main>

<button class="fab" data-add aria-label="新建">＋</button>

<dialog id="editor">
  <form class="sheet" method="dialog" id="editor-form">
    <h3 id="editor-title">新建</h3>
    <div class="seg" id="kind-seg" role="group" aria-label="类型">
      <button type="button" data-kind="todos">待办</button>
      <button type="button" data-kind="events">行程</button>
      <button type="button" data-kind="habits">每日任务</button>
    </div>
    <label class="field">名称<input name="title" required autocomplete="off" placeholder="要做什么？"></label>
    <div data-for="events todos" class="row">
      <label class="field">日期<input type="date" name="date"></label>
      <label class="field" data-for="todos">重要
        <select name="star"><option value="">普通</option><option value="1">★ 重要</option></select>
      </label>
      <label class="field" data-for="events">地点<input name="place" autocomplete="off" placeholder="可不填"></label>
    </div>
    <div data-for="events" class="row">
      <label class="field">开始<input type="time" name="start" value="09:00"></label>
      <label class="field">结束<input type="time" name="end" value="10:00"></label>
    </div>
    <div data-for="habits" class="field">重复
      <div class="chips" id="day-chips"></div>
    </div>
    <p class="hint" data-for="todos">不填日期 = 随时做，会一直留在「今天」里直到完成。</p>
    <div class="actions">
      <button type="button" class="btn danger" id="editor-delete">删除</button>
      <span class="spacer"></span>
      <button type="button" class="btn" value="cancel" data-close>取消</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="settings">
  <div class="sheet">
    <h3>设置 · 同步</h3>

    <section class="sync-box" id="sync-box">
      <h4>云同步</h4>
      <div id="sync-unconfigured" hidden>
        <p class="hint">云同步还没设置：先在 Firebase 建一个免费项目，把设置填进 <code>planner/firebase-config.js</code>（步骤见 <code>planner/SETUP.md</code>）。在那之前，资料只存在这台设备上。</p>
      </div>
      <form id="login-form" hidden>
        <p class="hint">登录同一个账号，手机和电脑的资料就会自动同步。</p>
        <label class="field">邮箱<input type="email" name="email" autocomplete="username" required></label>
        <label class="field">密码<input type="password" name="password" autocomplete="current-password" minlength="6" required></label>
        <p class="form-error" id="login-error" role="alert"></p>
        <div class="actions" style="justify-content:flex-start;flex-wrap:wrap">
          <button type="submit" class="btn primary" data-auth="signin">登录</button>
          <button type="submit" class="btn" data-auth="signup">注册新账号</button>
          <button type="button" class="btn link" id="forgot">忘记密码</button>
        </div>
        <button type="button" class="btn google" id="google">用 Google 账号登录</button>
      </form>
      <div id="sync-account" hidden>
        <p class="account"><span id="account-email"></span></p>
        <p class="hint" id="sync-detail"></p>
        <div class="actions" style="justify-content:flex-start;flex-wrap:wrap">
          <button type="button" class="btn" id="sync-now">立即同步</button>
          <button type="button" class="btn danger" id="sign-out">退出登录</button>
        </div>
      </div>
    </section>

    <label class="field">把哪个班的课放进行程
      <select id="class-source">
        <option value="">不显示课程</option>
        <option value="2E3">2E3</option>
        <option value="2E4">2E4</option>
        <option value="3E2">3E2</option>
        <option value="3E4">3E4</option>
      </select>
    </label>
    <p class="hint">备份：把全部资料存成一个文件，或从文件恢复。</p>
    <div class="actions" style="justify-content:flex-start;flex-wrap:wrap">
      <button type="button" class="btn" id="export">导出备份</button>
      <label class="btn" style="cursor:pointer">导入备份<input type="file" id="import" accept="application/json" class="sr"></label>
      <span class="spacer"></span>
      <button type="button" class="btn primary" id="settings-done">完成</button>
    </div>
  </div>
</dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
