<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2E3 课表</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card-bg: #ffffff;
      --ink: #111111;
      --ink-muted: #555555;
      --ink-light: #888888;
      --border: #222222;
      --border-light: #d8d8d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      padding: env(safe-area-inset-top, 14px) 14px calc(env(safe-area-inset-bottom, 20px) + 20px) 14px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .date-badge {
      font-size: 13px;
      color: var(--ink-muted);
      font-weight: 600;
    }

    
    .status-bar {
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
    }

    .status-tag {
      background: var(--ink);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
    }

    .status-main {
      font-size: 13px;
      font-weight: 700;
    }

    .status-sub {
      font-size: 12px;
      color: var(--ink-muted);
    }

    
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .view-toggle {
      display: flex;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--card-bg);
    }

    .toggle-btn {
      border: none;
      background: transparent;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--ink-muted);
    }

    .toggle-btn.active {
      background: var(--ink);
      color: #ffffff;
    }

    .today-jump-btn {
      border: 1px solid var(--border-light);
      background: var(--card-bg);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: var(--ink);
    }

    
    .day-selector {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 14px;
      width: 100%;
    }

    .day-btn {
      min-width: 0;
      border: 1.5px solid var(--border-light);
      background: var(--card-bg);
      border-radius: 6px;
      padding: 6px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .day-btn .name {
      font-size: 13px;
      font-weight: 700;
    }

    .day-btn .info {
      font-size: 9px;
      font-weight: 600;
      color: var(--ink-light);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      padding: 0 1px;
    }

    .day-btn.active {
      border-color: var(--border);
      background: var(--ink);
      color: #ffffff;
    }

    .day-btn.active .info {
      color: #cccccc;
    }

    .day-btn.is-today:not(.active) {
      border-color: var(--border);
      background: #eeeeea;
    }

    
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .course-card {
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      border-radius: 6px;
      padding: 12px 14px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .time-txt {
      font-size: 16px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }

    .type-pill {
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .course-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .course-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--ink-muted);
      border-top: 1px dashed var(--border-light);
      padding-top: 6px;
      margin-top: 4px;
    }

    .loc-txt {
      font-weight: 600;
      color: var(--ink);
    }

    
    .gap-card {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-light);
      padding: 6px 0;
      position: relative;
    }

    .gap-card::before, .gap-card::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 25%;
      height: 1px;
      background: var(--border-light);
    }
    .gap-card::before { left: 5%; }
    .gap-card::after { right: 5%; }

    
    .empty-state {
      border: 1.5px dashed var(--border-light);
      background: var(--card-bg);
      border-radius: 6px;
      padding: 40px 14px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 13px;
      font-weight: 600;
    }

    
    .week-view {
      display: none;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      overflow-x: auto;
    }

    .week-table {
      width: 100%;
      min-width: 560px;
      border-collapse: collapse;
    }

    .week-th {
      border-bottom: 1.5px solid var(--border);
      border-right: 1px solid var(--border-light);
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 700;
      background: #f0f0ee;
      text-align: center;
    }
    .week-th:last-child { border-right: none; }

    .week-td {
      border-right: 1px solid var(--border-light);
      vertical-align: top;
      padding: 6px 4px;
      width: 20%;
    }
    .week-td:last-child { border-right: none; }

    .mini-box {
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: 4px;
      padding: 5px;
      margin-bottom: 6px;
      font-size: 11px;
    }

    .mini-time {
      font-weight: 700;
      font-size: 10px;
      color: var(--ink-muted);
      margin-bottom: 2px;
    }

    .mini-name {
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .mini-loc {
      font-size: 9px;
      color: var(--ink-light);
    }
  </style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="title">2E3 TIMETABLE</div>
    <div class="date-badge" id="headerDate">--</div>
  </div>

  <div class="status-bar" id="statusBar">
    <span class="status-tag" id="statusTag"></span>
    <span class="status-main" id="statusMain"></span>
    <span class="status-sub" id="statusSub"></span>
  </div>

  <div class="nav-row">
    <div class="view-toggle">
      <button class="toggle-btn active" id="btnDayView" onclick="setViewMode('day')">按日</button>
      <button class="toggle-btn" id="btnWeekView" onclick="setViewMode('week')">全周</button>
    </div>
    <button class="today-jump-btn" onclick="goToday()">回到今天</button>
  </div>

  <div id="dayViewContainer">
    <div class="day-selector">
      <button class="day-btn" id="d-0" onclick="selectDay(0)"><span class="name">一</span><span class="info">08:00</span></button>
      <button class="day-btn" id="d-1" onclick="selectDay(1)"><span class="name">二</span><span class="info">08:00</span></button>
      <button class="day-btn" id="d-2" onclick="selectDay(2)"><span class="name">三</span><span class="info">11:00</span></button>
      <button class="day-btn" id="d-3" onclick="selectDay(3)"><span class="name">四</span><span class="info">11:00</span></button>
      <button class="day-btn" id="d-4" onclick="selectDay(4)"><span class="name">五</span><span class="info">10:00</span></button>
      <button class="day-btn" id="d-5" onclick="selectDay(5)"><span class="name">六</span><span class="info">无课</span></button>
      <button class="day-btn" id="d-6" onclick="selectDay(6)"><span class="name">日</span><span class="info">无课</span></button>
    </div>

    <div class="timeline" id="timelineList"></div>
  </div>

  <div class="week-view" id="weekViewContainer">
    <table class="week-table">
      <thead>
        <tr>
          <th class="week-th">周一</th>
          <th class="week-th">周二</th>
          <th class="week-th">周三</th>
          <th class="week-th">周四</th>
          <th class="week-th">周五</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="week-td" id="w-col-0"></td>
          <td class="week-td" id="w-col-1"></td>
          <td class="week-td" id="w-col-2"></td>
          <td class="week-td" id="w-col-3"></td>
          <td class="week-td" id="w-col-4"></td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  const SCHEDULE = {
    "0": [
      {"start": 480, "end": 600, "name": "Mathematics 2", "type": "Lecture", "loc": "SK3 102"},
      {"start": 600, "end": 720, "name": "Physics 2", "type": "Lecture", "loc": "SK3 102"},
      {"start": 780, "end": 900, "name": "Programming", "type": "Lecture", "loc": "Auditorium"},
      {"start": 1020, "end": 1200, "name": "Academic English", "type": "Seminar", "loc": "LTCL 9 (HL2-109)"}
    ],
    "1": [
      {"start": 480, "end": 570, "name": "Engineering Communication (ECS)", "type": "Seminar", "loc": "LTCL 9 (HL2-109)"}
    ],
    "2": [
      {"start": 660, "end": 840, "name": "Programming", "type": "Lab", "loc": "PA3 106 Lab"},
      {"start": 960, "end": 1140, "name": "Physics 2", "type": "Workshop", "loc": "SK2 101 / SK3 205"}
    ],
    "3": [
      {"start": 660, "end": 780, "name": "Physics 2", "type": "Clinic", "loc": "Auditorium"},
      {"start": 930, "end": 1020, "name": "Mathematics 2", "type": "Tutorial", "loc": "PA3 209"},
      {"start": 1020, "end": 1110, "name": "Engineering Communication (ECS)", "type": "Seminar", "loc": "PA3 203"}
    ],
    "4": [
      {"start": 600, "end": 690, "name": "Mathematics 2", "type": "Tutorial", "loc": "PA3 210"},
      {"start": 900, "end": 1080, "name": "Academic English", "type": "Seminar", "loc": "LTCL 10 (HL2-110)"}
    ],
    "5": [],
    "6": []
  };

  const DAY_NAMES = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
  let activeDay = (new Date().getDay() + 6) % 7;

  function toTime(m) {
    const h = String(Math.floor(m / 60)).padStart(2, '0');
    const min = String(m % 60).padStart(2, '0');
    return `${h}:${min}`;
  }

  function renderDay() {
    const today = (new Date().getDay() + 6) % 7;
    for (let d = 0; d < 7; d++) {
      const btn = document.getElementById(`d-${d}`);
      if (btn) {
        btn.classList.toggle('active', d === activeDay);
        btn.classList.toggle('is-today', d === today);
      }
    }

    const container = document.getElementById('timelineList');
    container.innerHTML = '';
    const list = SCHEDULE[String(activeDay)] || [];

    if (list.length === 0) {
      container.innerHTML = `<div class="empty-state">今日全天无排课</div>`;
      return;
    }

    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      const durH = (c.end - c.start) / 60;
      const durStr = durH === 1 ? '1h' : (durH % 1 === 0 ? `${durH}h` : `${durH.toFixed(1)}h`);

      const card = document.createElement('div');
      card.className = 'course-card';
      card.innerHTML = `
        <div class="card-head">
          <span class="time-txt">${toTime(c.start)} — ${toTime(c.end)}</span>
          <span class="type-pill">${c.type}</span>
        </div>
        <div class="course-name">${c.name}</div>
        <div class="course-meta">
          <span class="loc-txt">📍 ${c.loc}</span>
          <span>${durStr}</span>
        </div>
      `;
      container.appendChild(card);

      if (i < list.length - 1) {
        const gap = list[i + 1].start - c.end;
        if (gap >= 60) {
          const gapH = (gap / 60).toFixed(1).replace('.0', '');
          const gapEl = document.createElement('div');
          gapEl.className = 'gap-card';
          gapEl.textContent = `课间 ${gapH} 小时 (${toTime(c.end)} - ${toTime(list[i + 1].start)})`;
          container.appendChild(gapEl);
        }
      }
    }
  }

  function renderWeek() {
    for (let d = 0; d < 5; d++) {
      const col = document.getElementById(`w-col-${d}`);
      col.innerHTML = '';
      const list = SCHEDULE[String(d)] || [];
      if (list.length === 0) {
        col.innerHTML = '<div style="text-align:center; padding:15px 0; color:#888; font-size:10px;">无课</div>';
      } else {
        list.forEach(c => {
          const box = document.createElement('div');
          box.className = 'mini-box';
          box.innerHTML = `
            <div class="mini-time">${toTime(c.start)}-${toTime(c.end)}</div>
            <div class="mini-name">${c.name}</div>
            <div class="mini-loc">${c.loc}</div>
          `;
          col.appendChild(box);
        });
      }
    }
  }

  function selectDay(d) {
    activeDay = d;
    renderDay();
  }

  function goToday() {
    activeDay = (new Date().getDay() + 6) % 7;
    selectDay(activeDay);
  }

  function setViewMode(mode) {
    const isDay = mode === 'day';
    document.getElementById('btnDayView').classList.toggle('active', isDay);
    document.getElementById('btnWeekView').classList.toggle('active', !isDay);
    document.getElementById('dayViewContainer').style.display = isDay ? 'block' : 'none';
    document.getElementById('weekViewContainer').style.display = isDay ? 'none' : 'block';
  }

  function updateStatus() {
    const now = new Date();
    const curMin = now.getHours() * 60 + now.getMinutes();
    const today = (now.getDay() + 6) % 7;

    const m = now.getMonth() + 1;
    const dt = now.getDate();
    document.getElementById('headerDate').textContent = `${m}月${dt}日 · ${DAY_NAMES[today]}`;

    const tag = document.getElementById('statusTag');
    const main = document.getElementById('statusMain');
    const sub = document.getElementById('statusSub');

    const todayList = SCHEDULE[String(today)] || [];

    const ongoing = todayList.find(c => curMin >= c.start && curMin < c.end);
    if (ongoing) {
      tag.textContent = '上课中';
      main.textContent = `${ongoing.name} (${ongoing.type})`;
      sub.textContent = `剩 ${ongoing.end - curMin} 分钟 · ${ongoing.loc}`;
      return;
    }

    const next = todayList.find(c => c.start > curMin);
    if (next) {
      const wait = next.start - curMin;
      const waitStr = wait >= 60 ? `${Math.floor(wait / 60)}h ${wait % 60}m` : `${wait}分钟`;
      tag.textContent = '待命中';
      main.textContent = `下节: ${next.name}`;
      sub.textContent = `${toTime(next.start)} · 剩 ${waitStr} · ${next.loc}`;
      return;
    }

    tag.textContent = '已结束';
    main.textContent = '今日全部课程已完成';
    const tomorrow = (today + 1) % 7;
    const tomList = SCHEDULE[String(tomorrow)] || [];
    if (tomList.length > 0) {
      sub.textContent = `明日首节: ${toTime(tomList[0].start)} ${tomList[0].name}`;
    } else {
      sub.textContent = '明日全天无课';
    }
  }

  renderDay();
  renderWeek();
  updateStatus();
  setInterval(updateStatus, 30000);
</script>
</body>
</html>
