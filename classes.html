<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Curtin 课表查询 | 四科班级全览</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card-bg: #ffffff;
      --ink: #111111;
      --ink-muted: #555555;
      --ink-light: #888888;
      --border: #222222;
      --border-light: #d8d8d4;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      padding: env(safe-area-inset-top, 14px) 14px calc(env(safe-area-inset-bottom, 20px) + 20px) 14px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 540px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .date-badge {
      font-size: 13px;
      color: var(--ink-muted);
      font-weight: 600;
    }

    /* Class Switcher */
    .class-bar {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .class-bar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .class-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--ink-muted);
    }

    .class-meta {
      font-size: 11px;
      color: var(--ink-light);
      font-weight: 600;
    }

    .class-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .class-btn {
      flex: 1;
      min-width: 60px;
      padding: 7px 4px;
      border: 1.5px solid var(--border-light);
      background: #fafaf8;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      color: var(--ink);
    }

    .class-btn:active {
      transform: scale(0.97);
    }

    .class-btn.active {
      background: var(--ink);
      color: #ffffff;
      border-color: var(--ink);
    }

    .class-dropdown-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 4px;
      border-top: 1px dashed var(--border-light);
      font-size: 12px;
    }

    .class-select {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: #ffffff;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      outline: none;
    }

    /* Live Status Bar */
    .status-bar {
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
    }

    .status-tag {
      background: var(--ink);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
    }

    .status-main {
      font-size: 13px;
      font-weight: 700;
    }

    .status-sub {
      font-size: 12px;
      color: var(--ink-muted);
    }

    /* View Controls */
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .view-toggle {
      display: flex;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--card-bg);
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: var(--ink-muted);
      transition: all 0.15s;
    }

    .toggle-btn.active {
      background: var(--ink);
      color: #ffffff;
    }

    .today-jump-btn {
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      cursor: pointer;
      color: var(--ink);
    }

    .today-jump-btn:active {
      background: #eee;
    }

    /* Day Selector */
    .day-selector {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
    }

    .day-btn {
      flex: 1;
      padding: 8px 2px;
      border: 1px solid var(--border-light);
      background: var(--card-bg);
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .day-btn .name {
      font-size: 13px;
      font-weight: 700;
    }

    .day-btn .info {
      font-size: 10px;
      color: var(--ink-light);
      font-weight: 500;
    }

    .day-btn.active {
      border: 1.5px solid var(--border);
      background: var(--ink);
      color: #ffffff;
    }

    .day-btn.active .info {
      color: #dddddd;
    }

    .day-btn.is-today:not(.active) {
      border-color: var(--border);
      font-weight: 800;
      box-shadow: inset 0 0 0 1px var(--border);
    }

    /* Timeline & Course Cards */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .course-card {
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 2px 0 rgba(0,0,0,0.05);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .time-txt {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .type-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #fafaf8;
    }

    .course-name {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .course-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--ink-muted);
      font-weight: 600;
    }

    .loc-txt {
      color: var(--ink);
      font-weight: 600;
    }

    .gap-card {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-light);
      padding: 4px;
      border: 1px dashed var(--border-light);
      border-radius: 6px;
      background: #fafaf8;
    }

    .empty-state {
      border: 1.5px dashed var(--border-light);
      border-radius: 8px;
      padding: 36px 16px;
      text-align: center;
      color: var(--ink-light);
      font-size: 14px;
      font-weight: 600;
      background: var(--card-bg);
    }

    /* Week Table View */
    .week-view {
      display: none;
      overflow-x: auto;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
    }

    .week-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .week-th {
      border-bottom: 1.5px solid var(--border);
      border-right: 1px solid var(--border-light);
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 700;
      background: #f0f0ee;
      text-align: center;
    }
    .week-th:last-child { border-right: none; }

    .week-td {
      border-right: 1px solid var(--border-light);
      vertical-align: top;
      padding: 6px 4px;
      width: 20%;
    }
    .week-td:last-child { border-right: none; }

    .mini-box {
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: 4px;
      padding: 5px;
      margin-bottom: 6px;
      font-size: 11px;
    }

    .mini-time {
      font-weight: 700;
      font-size: 10px;
      color: var(--ink-muted);
      margin-bottom: 2px;
    }

    .mini-name {
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .mini-loc {
      font-size: 9px;
      color: var(--ink-light);
    }

    /* Subject Quick Legend */
    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }

    .legend-item {
      font-size: 11px;
      color: var(--ink-muted);
      font-weight: 600;
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      padding: 3px 7px;
      border-radius: 4px;
    }
  </style>
</head>

<div class="app">

  <div class="header">

    <div class="date-badge" id="headerDate">--</div>
  </div>

  <!-- Class Selector -->
  <div class="class-bar">

        <option value="2E5">2E5 (Physics 2 周一 15:00)</option>
        <option value="2E6">2E6 (Physics 2 周二 08:00)</option>
        <option value="2E7">2E7 (Physics 2 周三 08:00)</option>
        <option value="2E8">2E8 (Physics 2 周二 14:00)</option>
      </select>
    </div>
  </div>

  <div class="status-bar" id="statusBar">
    <span class="status-tag" id="statusTag">STATUS</span>
    <span class="status-main" id="statusMain">正在获取课程状态...</span>
    <span class="status-sub" id="statusSub"></span>
  </div>

  <div class="nav-row">
    <div class="view-toggle">
      <button class="toggle-btn active" id="btnDayView" onclick="setViewMode('day')">按日</button>
      <button class="toggle-btn" id="btnWeekView" onclick="setViewMode('week')">全周</button>
    </div>
    <button class="today-jump-btn" onclick="goToday()">回到今天</button>
  </div>

  <!-- Day View -->
  <div id="dayViewContainer">
    <div class="day-selector">
      <button class="day-btn" id="d-0" onclick="selectDay(0)"><span class="name">一</span><span class="info">--</span></button>
      <button class="day-btn" id="d-1" onclick="selectDay(1)"><span class="name">二</span><span class="info">--</span></button>
      <button class="day-btn" id="d-2" onclick="selectDay(2)"><span class="name">三</span><span class="info">--</span></button>
      <button class="day-btn" id="d-3" onclick="selectDay(3)"><span class="name">四</span><span class="info">--</span></button>
      <button class="day-btn" id="d-4" onclick="selectDay(4)"><span class="name">五</span><span class="info">--</span></button>
      <button class="day-btn" id="d-5" onclick="selectDay(5)"><span class="name">六</span><span class="info">无课</span></button>
      <button class="day-btn" id="d-6" onclick="selectDay(6)"><span class="name">日</span><span class="info">无课</span></button>
    </div>

    <div class="timeline" id="timelineList"></div>
  </div>

  <!-- Week View -->
  <div class="week-view" id="weekViewContainer">
    <table class="week-table">
      <thead>
        <tr>
          <th class="week-th">周一</th>
          <th class="week-th">周二</th>
          <th class="week-th">周三</th>
          <th class="week-th">周四</th>
          <th class="week-th">周五</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="week-td" id="w-col-0"></td>
          <td class="week-td" id="w-col-1"></td>
          <td class="week-td" id="w-col-2"></td>
          <td class="week-td" id="w-col-3"></td>
          <td class="week-td" id="w-col-4"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Subject Quick Legend -->
  <div class="legend-row">
    <span class="legend-item">🔬 Physics 2 (CMFP0051)</span>
    <span class="legend-item">📐 Math 3 (CMFP0043)</span>
    <span class="legend-item">🧪 Chemistry (CMFP0052)</span>
    <span class="legend-item">💡 Critical Thinking (CMFP0023)</span>
  </div>

</div>

  const DAY_NAMES = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
  let currentClass = "3E1";
  let activeDay = (new Date().getDay() + 6) % 7;
  let currentViewMode = "day";

  // Check URL params or localStorage
  const urlParams = new URLSearchParams(window.location.search);
  const qClass = urlParams.get('class') || window.location.hash.replace('#', '');
  if (qClass && ALL_SCHEDULES[qClass]) {
    currentClass = qClass;
  } else {
    const saved = localStorage.getItem('curtin_selected_class');
    if (saved && ALL_SCHEDULES[saved]) {
      currentClass = saved;
    }
  }

  function toTime(m) {
    const h = String(Math.floor(m / 60)).padStart(2, '0');
    const min = String(m % 60).padStart(2, '0');
    return `${h}:${min}`;
  }

  function selectClass(cls) {
    if (!ALL_SCHEDULES[cls]) return;
    currentClass = cls;
    localStorage.setItem('curtin_selected_class', cls);

    // Update active tab state
    document.querySelectorAll('.class-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.class === cls);
    });

    const sel = document.getElementById('otherClassSelect');
    if (cls.startsWith('2E')) {
      sel.value = cls;
    } else {
      sel.selectedIndex = 0;
    }

    document.getElementById('pageTitle').textContent = `${cls} TIMETABLE`;
    const count = Object.values(ALL_SCHEDULES[cls]).reduce((acc, arr) => acc + arr.length, 0);
    document.getElementById('classMeta').textContent = `${cls} 班共 ${count} 节排课`;

    updateDayButtonsInfo();
    renderDay();
    renderWeek();
    updateLiveStatus();
  }

  function updateDayButtonsInfo() {
    const sched = ALL_SCHEDULES[currentClass] || {};
    for (let d = 0; d < 7; d++) {
      const btn = document.getElementById(`d-${d}`);
      if (!btn) continue;
      const list = sched[String(d)] || [];
      const infoSpan = btn.querySelector('.info');
      if (list.length === 0) {
        infoSpan.textContent = "无课";
      } else {
        infoSpan.textContent = toTime(list[0].start);
      }
    }
  }

  function renderDay() {
    const today = (new Date().getDay() + 6) % 7;
    for (let d = 0; d < 7; d++) {
      const btn = document.getElementById(`d-${d}`);
      if (btn) {
        btn.classList.toggle('active', d === activeDay);
        btn.classList.toggle('is-today', d === today);
      }
    }

    const container = document.getElementById('timelineList');
    container.innerHTML = '';
    const sched = ALL_SCHEDULES[currentClass] || {};
    const list = sched[String(activeDay)] || [];

    if (list.length === 0) {
      container.innerHTML = `<div class="empty-state">${DAY_NAMES[activeDay]} 全天无排课</div>`;
      return;
    }

    for (let i = 0; i < list.length; i++) {
      const c = list[i];
      const durH = (c.end - c.start) / 60;
      const durStr = durH === 1 ? '1h' : (durH % 1 === 0 ? `${durH}h` : `${durH.toFixed(1)}h`);

      const card = document.createElement('div');
      card.className = 'course-card';
      card.innerHTML = `
        <div class="card-head">
          <span class="time-txt">${toTime(c.start)} — ${toTime(c.end)}</span>
          <span class="type-pill">${c.type}</span>
        </div>
        <div class="course-name">${c.name}</div>
        <div class="course-meta">
          <span class="loc-txt">📍 ${c.loc}</span>
          <span>${durStr}</span>
        </div>
      `;
      container.appendChild(card);

      if (i < list.length - 1) {
        const gap = list[i + 1].start - c.end;
        if (gap >= 60) {
          const gapH = (gap / 60).toFixed(1).replace('.0', '');
          const gapEl = document.createElement('div');
          gapEl.className = 'gap-card';
          gapEl.textContent = `课间 ${gapH} 小时 (${toTime(c.end)} - ${toTime(list[i + 1].start)})`;
          container.appendChild(gapEl);
        }
      }
    }
  }

  function renderWeek() {
    const sched = ALL_SCHEDULES[currentClass] || {};
    for (let d = 0; d < 5; d++) {
      const col = document.getElementById(`w-col-${d}`);
      col.innerHTML = '';
      const list = sched[String(d)] || [];

      if (list.length === 0) {
        col.innerHTML = '<div style="color:var(--ink-light);font-size:11px;text-align:center;padding:12px 0;">无课</div>';
        continue;
      }

      list.forEach(c => {
        const box = document.createElement('div');
        box.className = 'mini-box';
        box.innerHTML = `
          <div class="mini-time">${toTime(c.start)}</div>
          <div class="mini-name">${c.name}</div>
          <div class="mini-loc">📍 ${c.loc.split('/')[0].trim()}</div>
        `;
        col.appendChild(box);
      });
    }
  }

  function selectDay(d) {
    activeDay = d;
    renderDay();
  }

  function setViewMode(mode) {
    currentViewMode = mode;
    document.getElementById('btnDayView').classList.toggle('active', mode === 'day');
    document.getElementById('btnWeekView').classList.toggle('active', mode === 'week');

    document.getElementById('dayViewContainer').style.display = mode === 'day' ? 'block' : 'none';
    document.getElementById('weekViewContainer').style.display = mode === 'week' ? 'block' : 'none';
  }

  function goToday() {
    activeDay = (new Date().getDay() + 6) % 7;
    setViewMode('day');
    renderDay();
  }

  function updateLiveStatus() {
    const now = new Date();
    const curDay = (now.getDay() + 6) % 7;
    const curMin = now.getHours() * 60 + now.getMinutes();

    // Date header
    const m = now.getMonth() + 1;
    const d = now.getDate();
    document.getElementById('headerDate').textContent = `${m}月${d}日 ${DAY_NAMES[curDay]}`;

    const sched = ALL_SCHEDULES[currentClass] || {};
    const todayList = sched[String(curDay)] || [];

    const tagEl = document.getElementById('statusTag');
    const mainEl = document.getElementById('statusMain');
    const subEl = document.getElementById('statusSub');

    if (todayList.length === 0) {
      tagEl.textContent = 'REST';
      mainEl.textContent = '今日无课，尽情休息';
      subEl.textContent = '';
      return;
    }

    let ongoing = null;
    let nextClass = null;

    for (let c of todayList) {
      if (curMin >= c.start && curMin < c.end) {
        ongoing = c;
        break;
      } else if (curMin < c.start) {
        if (!nextClass) nextClass = c;
      }
    }

    if (ongoing) {
      tagEl.textContent = 'IN CLASS';
      mainEl.textContent = `${ongoing.name} (${ongoing.type})`;
      subEl.textContent = `📍 ${ongoing.loc} · 下课还剩 ${ongoing.end - curMin} 分钟`;
    } else if (nextClass) {
      tagEl.textContent = 'NEXT';
      mainEl.textContent = `${nextClass.name} (${toTime(nextClass.start)})`;
      subEl.textContent = `📍 ${nextClass.loc} · 距离上课 ${nextClass.start - curMin} 分钟`;
    } else {
      tagEl.textContent = 'DONE';
      mainEl.textContent = '今日课程已全部结束';
      subEl.textContent = '好好休息或自习！';
    }
  }

  // Initialize
  selectClass(currentClass);
  updateLiveStatus();
  setInterval(updateLiveStatus, 30000);
</script>

</body>
</html>
